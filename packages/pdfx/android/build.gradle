group 'io.scer.pdf_renderer'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Built-in Kotlin is on by default on AGP 9+ unless the app sets
// `android.builtInKotlin=false`. KGP is applied through `pluginManager` because
// Flutter's text based KGP check would otherwise report this guarded line.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProperty = project.findProperty('android.builtInKotlin')
def builtInKotlinEnabled = agpMajor >= 9 &&
    (builtInKotlinProperty == null || builtInKotlinProperty.toString().toBoolean())

apply plugin: 'com.android.library'
if (!builtInKotlinEnabled) {
    pluginManager.apply('kotlin-android')
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'io.scer.pdf_renderer'
    }

    compileSdk 35

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (!builtInKotlinEnabled) {
        kotlinOptions {
            jvmTarget = '11'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
}
