group 'io.scer.pdf_renderer'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.23'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.5.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9 compiles Kotlin itself (built-in Kotlin) and fails the build when a
// library subproject applies the Kotlin Gradle Plugin (KGP). Built-in Kotlin is
// on by default on AGP 9+ and can be opted out of with `android.builtInKotlin=false`
// in the consuming app's gradle.properties; on AGP 8 the property has no effect.
// An explicit `false` must be honoured, so the property is checked for presence
// rather than truthiness (Groovy's `?:` would treat `false` as absent), and the
// one resulting boolean drives plugin application and compiler configuration.
// The pluginManager form keeps Flutter's static KGP detection (a text match on
// `apply plugin: 'kotlin-android'`) from flagging this plugin. See
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlinProperty = project.findProperty('android.builtInKotlin')
def builtInKotlinEnabled = agpMajor >= 9 &&
    (builtInKotlinProperty == null || builtInKotlinProperty.toString().toBoolean())

apply plugin: 'com.android.library'
if (!builtInKotlinEnabled) {
    pluginManager.apply('kotlin-android')
}

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'io.scer.pdf_renderer'
    }

    compileSdk 35

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 16
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    if (!builtInKotlinEnabled) {
        kotlinOptions {
            jvmTarget = '11'
        }
    }
}

if (builtInKotlinEnabled) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
}
